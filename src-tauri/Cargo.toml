[package]
name = "shax"
version = "0.1.0"
description = "Shax: a structured, searchable, AI-assisted terminal."
authors = ["Shax contributors"]
edition = "2021"

[lints.clippy]
all = "deny"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "process", "fs"] }
uuid = { version = "1.23.3", features = ["v4", "serde"] }
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22.1"
vte = "0.15.0"
tempfile = "3.27.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
# M6 assistant. reqwest for HTTPS to Anthropic; futures-util
# for streaming the response body chunk-by-chunk (SSE parsed
# in `assistant::anthropic::sse`); keyring for OS-native
# credential storage (macOS Keychain / Windows Credential
# Manager / Linux Secret Service).
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
ort = "2.0.0-rc.12"
# `default-features = false` drops `esaxx-rs` (Unigram
# trainer — unused; we load a pre-serialized `tokenizer.json`
# and only encode with WordPiece) and `indicatif` (training
# progress bars). Dropping `esaxx-rs` also fixes a Windows
# MSVC-runtime mismatch — it defaults to `/MT` static, while
# `ort-sys` builds `/MD` dynamic, and the linker can't merge
# the two.
#
# `fancy-regex` (pure Rust) replaces the default `onig` (C
# library) — tokenizers requires one of the two regex
# backends, and fancy-regex avoids another C-linkage vector
# on Windows.
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
# M12.4b — statusbar native probes. `starship-battery` is the
# actively-maintained fork of the (now-stale) `battery` crate;
# Starship prompt uses it, so it's kept current against macOS /
# Linux / Windows quirks. `local-ip-address` returns the primary
# interface's IP via each OS's native syscall.
starship-battery = "0.11"
local-ip-address = "0.6"
# M13.3 — sidebar CPU / memory probe (spec §19). Feature-gated
# so we only compile the two backends we actually use — the
# default feature set pulls in disk / network stats we don't
# need and can't sample at the sidebar's 2s cadence without
# adding noise. `component` is intentionally off (thermal
# sensors need OS-specific quirks we're not exercising).
# `network` joined `system` in the M13 refinement pass for the
# Network card's throughput lines. Still no `disk` / `component`.
sysinfo = { version = "0.32", default-features = false, features = ["system", "network"] }

# M13.4 — the sidebar's keep-awake assertion (spec §19 D6). macOS and
# Linux shell out to `caffeinate` / `systemd-inhibit`, which needs no
# crate; Windows has no equivalent command and uses
# `SetThreadExecutionState` directly. Already in the dependency tree
# via Tauri, so this pulls nothing new down.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }

# `prctl(PR_SET_PDEATHSIG)` so the keep-awake helper dies with Shax.
# macOS gets the same guarantee from `caffeinate -w <pid>`; Linux has
# no equivalent flag. Already in the tree transitively.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

